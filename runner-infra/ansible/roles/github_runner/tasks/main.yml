- name: Fail if github_pat is not provided
  assert:
    that:
      - github_pat is defined
      - github_pat | length > 0
    fail_msg: "github_pat must be passed, e.g. -e github_pat=ghp_xxx"

- name: Create runner group
  group:
    name: "{{ runner_user }}"
    state: present

- name: Create runner user
  user:
    name: "{{ runner_user }}"
    group: "{{ runner_user }}"
    groups: docker
    shell: /bin/bash
    home: "{{ runner_dir }}"
    system: true

- name: Ensure runner directory exists
  file:
    path: "{{ runner_dir }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0755"

- name: Download the Actions runner
  get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
    dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    mode: "0644"

- name: Extract the Actions runner
  unarchive:
    src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    dest: "{{ runner_dir }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    creates: "{{ runner_dir }}/config.sh"

- name: Check whether the runner is already configured
  stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_configured

- name: Request a runner registration token
  uri:
    url: "https://api.github.com/repos/{{ github_owner }}/{{ github_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "Bearer {{ github_pat }}"
      Accept: "application/vnd.github+json"
    status_code: 201
  register: registration
  when: not runner_configured.stat.exists

- name: Configure the runner
  become_user: "{{ runner_user }}"
  command:
    chdir: "{{ runner_dir }}"
    cmd: >
      ./config.sh --unattended
      --url https://github.com/{{ github_owner }}/{{ github_repo }}
      --token {{ registration.json.token }}
      --name {{ runner_name }}
      --labels {{ runner_labels }}
      --replace
  when: not runner_configured.stat.exists

- name: Install the runner service
  command:
    chdir: "{{ runner_dir }}"
    cmd: "./svc.sh install {{ runner_user }}"
    creates: "/etc/systemd/system/actions.runner.{{ github_owner }}-{{ github_repo }}.{{ runner_name }}.service"

- name: Start and enable the runner service
  command:
    chdir: "{{ runner_dir }}"
    cmd: "./svc.sh start"
  register: svc_start
  changed_when: "'started' in svc_start.stdout | default('')"
