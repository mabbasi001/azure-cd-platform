name: app

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "tests/perf/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrrwsharede8fwus3
  ACR_LOGIN_SERVER: acrrwsharede8fwus3.azurecr.io
  BACKEND_IMAGE: rw-backend
  FRONTEND_IMAGE: rw-frontend
  RESOURCE_GROUP: rg-rw-dev
  BACKEND_APP: app-rw-dev-api-e8f-wus3
  FRONTEND_APP: app-rw-dev-web-e8f-wus3
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Decide what to build: a push touches only what changed; a manual run rebuilds
  # both (the escape hatch for base-image bumps).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'apps/docker-compose.yml'
            frontend:
              - 'apps/frontend/**'
              - 'apps/docker-compose.yml'
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >>"$GITHUB_OUTPUT"
            echo "frontend=true" >>"$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >>"$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >>"$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        working-directory: apps
        run: docker compose up -d --build
      - name: Wait for the backend and exercise the API
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/docs >/dev/null && break
            sleep 3
          done
          user="ci$(date +%s)"
          curl -fsS -X POST http://localhost:8000/api/users \
            -H 'Content-Type: application/json' \
            -d "{\"user\":{\"username\":\"$user\",\"email\":\"$user@example.com\",\"password\":\"password123\"}}" \
            | grep -q token
          curl -fsS http://localhost:8000/api/tags | grep -q tags
      - name: Check the frontend serves
        run: curl -fsS http://localhost:4100/healthz | grep -q ok
      - name: Tear down
        if: always()
        working-directory: apps
        run: docker compose down -v

  build-push-backend:
    needs: [test, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"
      - name: Build and push backend
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest" \
            --push apps/backend

  build-push-frontend:
    needs: [test, changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"
      - name: Build and push frontend
        run: |
          docker buildx build --platform linux/amd64 \
            -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest" \
            --push apps/frontend

  deploy-backend:
    needs: build-push-backend
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the API app at the new image
        run: |
          az webapp config container set --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
            --container-image-name "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:$IMAGE_TAG"
      - name: Restart the API app
        run: az webapp restart --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP"
      - name: Post-deploy smoke test
        run: |
          for _ in $(seq 1 40); do
            curl -fsS "https://$BACKEND_APP.azurewebsites.net/docs" >/dev/null && break
            sleep 6
          done
          curl -fsS "https://$BACKEND_APP.azurewebsites.net/api/tags" | grep -q tags

  deploy-frontend:
    needs: build-push-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the web app at the new image
        run: |
          az webapp config container set --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" \
            --container-image-name "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$IMAGE_TAG"
      - name: Restart the web app
        run: az webapp restart --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP"
      - name: Post-deploy smoke test
        run: |
          for _ in $(seq 1 40); do
            curl -fsS "https://$FRONTEND_APP.azurewebsites.net/healthz" >/dev/null && break
            sleep 6
          done
          curl -fsS "https://$FRONTEND_APP.azurewebsites.net/healthz" | grep -q ok

  performance:
    needs: [changes, deploy-backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm up the app (avoid measuring container cold start)
        run: |
          for _ in $(seq 1 20); do
            curl -fsS "https://$BACKEND_APP.azurewebsites.net/api/tags" >/dev/null || true
            sleep 1
          done
      - name: Run k6 performance gate
        run: |
          docker run --rm -i \
            -e BASE_URL="https://$BACKEND_APP.azurewebsites.net" \
            -v "$PWD/tests/perf:/perf" \
            grafana/k6 run /perf/smoke.js
