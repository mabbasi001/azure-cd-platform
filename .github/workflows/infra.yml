name: infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        type: choice
        options: [shared, app, frontdoor]
        default: shared

permissions:
  id-token: write
  contents: read

# Runs on GitHub-hosted runners for now: the self-hosted agent VM is blocked by
# Azure capacity in the region. Locked-down resources are reached by allow-listing
# the runner's ephemeral egress IP for the duration of the job.
env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  KEY_VAULT_NAME: kv-rw-shared-e8f-wus3

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [shared, identity, app, frontdoor]
    defaults:
      run:
        working-directory: infra/terraform/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan shared
        working-directory: infra/terraform/stacks/shared
        run: |
          terraform init
          terraform plan -input=false

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply shared
        if: github.event_name == 'push' || inputs.stack == 'shared'
        working-directory: infra/terraform/stacks/shared
        run: |
          terraform init
          bash ../../../../scripts/ci/tf_apply.sh

      - name: Allow runner IP on Key Vault
        if: github.event_name == 'push' || inputs.stack == 'app'
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)"
          echo "RUNNER_IP=$RUNNER_IP" >>"$GITHUB_ENV"
          az keyvault network-rule add --name "$KEY_VAULT_NAME" --ip-address "$RUNNER_IP" --output none
          sleep 20

      - name: Apply app (dev)
        if: github.event_name == 'push' || inputs.stack == 'app'
        working-directory: infra/terraform/stacks/app
        run: |
          terraform init
          terraform workspace select dev || terraform workspace new dev
          bash ../../../../scripts/ci/tf_apply.sh -var-file=dev.tfvars

      - name: Remove runner IP from Key Vault
        if: always() && env.RUNNER_IP != ''
        run: az keyvault network-rule remove --name "$KEY_VAULT_NAME" --ip-address "$RUNNER_IP" --output none

      # Global entry point: origins are read from the app stack's outputs so the
      # two stacks stay in sync without copying hostnames by hand.
      - name: Apply frontdoor
        if: github.event_name == 'workflow_dispatch' && inputs.stack == 'frontdoor'
        run: |
          cd infra/terraform/stacks/app
          terraform init
          terraform workspace select dev
          BE="$(terraform output -raw backend_hostname)"
          FE="$(terraform output -raw frontend_hostname)"
          cd ../frontdoor
          terraform init
          bash ../../../../scripts/ci/tf_apply.sh \
            -var="backend_origin_hostnames=[\"$BE\"]" \
            -var="frontend_origin_hostnames=[\"$FE\"]"
