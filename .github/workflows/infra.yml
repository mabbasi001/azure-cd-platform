name: infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to apply
        type: choice
        options: [shared, app]
        default: shared

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        stack: [shared, identity, app]
    defaults:
      run:
        working-directory: infra/terraform/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan shared
        working-directory: infra/terraform/stacks/shared
        run: |
          terraform init
          terraform plan -input=false
      - name: Plan app (dev)
        working-directory: infra/terraform/stacks/app
        run: |
          terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform plan -input=false -var-file=dev.tfvars

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply shared
        if: github.event_name == 'push' || inputs.stack == 'shared'
        working-directory: infra/terraform/stacks/shared
        run: |
          terraform init
          terraform apply -input=false -auto-approve
      - name: Apply app (dev)
        if: github.event_name == 'push' || inputs.stack == 'app'
        working-directory: infra/terraform/stacks/app
        run: |
          terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform apply -input=false -auto-approve -var-file=dev.tfvars
